global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'synapse'
    environment: 'development'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load rules files
rule_files:
  # - "first.rules"
  # - "second.rules"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 5s
    metrics_path: /metrics

  # Synapse Application
  - job_name: 'synapse'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['synapse:8080', 'localhost:8080']
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true

  # Node Exporter (optional - for host metrics)
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['localhost:9100']
