services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: synapse-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse_user
      POSTGRES_PASSWORD: synapse_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker-init/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse_user -d synapse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - synapse-network

  # ============================================================================
  # Synapse Application
  # ============================================================================
  synapse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synapse
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      # Database configuration (matches PostgresConfig.java env var names)
      DB_URL: jdbc:postgresql://postgres:5432/synapse
      DB_USERNAME: synapse_user
      DB_PASSWORD: synapse_password
      # Service discovery - override application.yml defaults
      MEMORY_EPISODIC_REDIS_HOST: redis
      MEMORY_EPISODIC_REDIS_PORT: "6379"
      MEMORY_SEMANTIC_QDRANT_HOST: qdrant
      MEMORY_SEMANTIC_QDRANT_PORT: "6334"
      # Spring Redis configuration for health checks and connection
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      # Application configuration
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # Disable Flyway - version incompatibility with PostgreSQL 15+
      JAVA_TOOL_OPTIONS: "-Dspring.flyway.enabled=false"
    volumes:
      # Persist SQLite database
      - synapse-data:/var/lib/synapse
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    networks:
      - synapse-network

  # ============================================================================
  # Redis - Episodic Memory Store
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: synapse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - synapse-network

  # ============================================================================
  # Qdrant - Semantic Memory Store
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: synapse-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT_API_KEY=${MEMORY_SEMANTIC_QDRANT_API_KEY:-}
    restart: unless-stopped
    networks:
      - synapse-network

  # ============================================================================
  # Prometheus - Metrics Collection
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: synapse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    networks:
      - synapse-network
    depends_on:
      - synapse

  # ============================================================================
  # Grafana - Metrics Visualization
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: synapse-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-prometheus-datasource
    restart: unless-stopped
    networks:
      - synapse-network
    depends_on:
      - prometheus

# ============================================================================
# Named Volumes - Data Persistence
# ============================================================================
volumes:
  synapse-data:
    name: synapse-sqlite-data
  postgres-data:
    name: synapse-postgres-data
  redis-data:
    name: synapse-redis-data
  qdrant-data:
    name: synapse-qdrant-data
  prometheus-data:
    name: synapse-prometheus-data
  grafana-data:
    name: synapse-grafana-data

# ============================================================================
# Network - Service Discovery
# ============================================================================
networks:
  synapse-network:
    name: synapse-network
    driver: bridge
