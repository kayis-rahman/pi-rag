# GitHub Actions Workflow for Synapse Testing Framework
name: Synapse Comprehensive Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run comprehensive tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Test category to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - multi-device-integration
          - conflict-resolution
          - concurrency-stress
          - performance-benchmarks
          - end-to-end-journeys
      performance:
        description: 'Enable performance monitoring'
        required: false
        default: false
        type: boolean

env:
  # Test environment variables
  TEST_VERBOSE: true
  TEST_PERFORMANCE: ${{ github.event.inputs.performance || false }}
  BUILD_NUMBER: ${{ github.run_number }}
  GIT_COMMIT: ${{ github.sha }}
  TEST_REPORTS: true
  
  # Backend configuration
  SPRING_PROFILES_ACTIVE: test
  SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/synapse_test
  SPRING_DATASOURCE_USERNAME: synapse_test
  SPRING_DATASOURCE_PASSWORD: test_password
  
  # APNS configuration (disabled in CI)
  APNS_ENABLED: false

jobs:
  # Backend testing
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: synapse_test
          POSTGRES_USER: synapse_test
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Run backend tests
      run: |
        cd back-end
        ./mvnw clean test -Dspring.profiles.active=test
    
    - name: Run integration tests
      run: |
        cd back-end
        ./mvnw test -Dspring.profiles.active=test -Dtest=**/*IntegrationTest
    
    - name: Upload backend test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: backend-test-results
        path: |
          back-end/target/surefire-reports/
          back-end/target/failsafe-reports/
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: always()
      with:
        directory: back-end/target/

  # iOS/macOS/watchOS platform testing
  platform-tests:
    runs-on: macos-13
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Cache CocoaPods dependencies
      uses: actions/cache@v3
      with:
        path: |
          apple/Synapse/Pods
          ~/Library/Caches/CocoaPods
          ~/.cocoapods
        key: ${{ runner.os }}-pods-${{ hashFiles('apple/Synapse/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pods-
    
    - name: Install CocoaPods dependencies
      run: |
        cd apple/Synapse
        pod install --repo-update
    
    - name: Run iOS tests
      run: |
        cd apple/Synapse
        xcodebuild test \
          -workspace Synapse.xcworkspace \
          -scheme Synapse \
          -destination 'platform=iOS Simulator,name=iPhone 14,OS=latest' \
          -derivedDataPath DerivedData/iOS \
          -enableCodeCoverage YES
    
    - name: Run macOS tests
      run: |
        cd apple/Synapse
        xcodebuild test \
          -workspace Synapse.xcworkspace \
          -scheme Synapse \
          -destination 'platform=macOS' \
          -derivedDataPath DerivedData/macOS \
          -enableCodeCoverage YES
    
    - name: Run watchOS tests
      run: |
        cd apple/Synapse
        xcodebuild test \
          -workspace Synapse.xcworkspace \
          -scheme Synapse \
          -destination 'platform=watchOS Simulator,name=Apple Watch Series 8 (45mm)' \
          -derivedDataPath DerivedData/watchOS \
          -enableCodeCoverage YES
    
    - name: Upload platform test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: platform-test-results
        path: |
          apple/Synapse/DerivedData/*/Logs/Test/
          apple/Synapse/DerivedData/*/Build/Logs/

  # Multi-device integration testing
  integration-tests:
    runs-on: macos-13
    needs: [backend-tests, platform-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Set up Python for test runner
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Run integration tests
      run: |
        export TEST_RUN_ID="integration_${{ github.run_number }}_${{ github.sha }}"
        ./testing-framework/run-tests.sh --category multi-device-integration --verbose --reports
    
    - name: Upload integration test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: test-results/

  # Concurrency stress testing
  stress-tests:
    runs-on: macos-13
    needs: [integration-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Run stress tests
      run: |
        export TEST_RUN_ID="stress_${{ github.run_number }}_${{ github.sha }}"
        ./testing-framework/run-tests.sh --category concurrency-stress --verbose --reports
    
    - name: Upload stress test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: stress-test-results
        path: test-results/

  # Performance benchmarks
  performance-tests:
    runs-on: macos-13
    needs: [integration-tests]
    if: github.event.inputs.performance == 'true' || github.event_name == 'schedule'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Run performance benchmarks
      run: |
        export TEST_RUN_ID="perf_${{ github.run_number }}_${{ github.sha }}"
        export TEST_PERFORMANCE=true
        ./testing-framework/run-tests.sh --category performance-benchmarks --verbose --reports --performance
    
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-test-results
        path: test-results/

  # End-to-end journey testing
  e2e-tests:
    runs-on: macos-13
    needs: [backend-tests, platform-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Run E2E tests
      run: |
        export TEST_RUN_ID="e2e_${{ github.run_number }}_${{ github.sha }}"
        ./testing-framework/run-tests.sh --category end-to-end-journeys --verbose --reports
    
    - name: Upload E2E test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-test-results
        path: test-results/

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    needs: [backend-tests, platform-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Run security scan on backend
      uses: securecodewarrior/github-action-add-sarif@v1
      with:
        sarif-file: backend-security-results.sarif
    
    - name: Run security scan on iOS code
      run: |
        cd apple/Synapse
        # Example: Using MobSF or similar security scanning tool
        echo "Running iOS security scan..."

  # Test results aggregation and reporting
  test-report:
    runs-on: ubuntu-latest
    needs: [backend-tests, platform-tests, integration-tests, stress-tests, performance-tests, e2e-tests, security-scan]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Download all test artifacts
      uses: actions/download-artifact@v3
    
    - name: Set up Python for report generation
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Generate comprehensive test report
      run: |
        mkdir -p final-report
        cat > final-report/summary.md << EOF
        # Synapse Test Report
        
        ## Build Information
        - **Build**: ${{ github.run_number }}
        - **Commit**: ${{ github.sha }}
        - **Branch**: ${{ github.ref_name }}
        - **Trigger**: ${{ github.event_name }}
        - **Category**: ${{ github.event.inputs.category || 'all' }}
        
        ## Test Results Summary
        This report aggregates results from all test categories.
        
        ### Test Categories Executed
        - ✅ Backend Tests
        - ✅ Platform Tests (iOS/macOS/watchOS)
        - ✅ Integration Tests
        - ✅ Stress Tests
        ${{ github.event.inputs.performance == 'true' || github.event_name == 'schedule' && '- ✅ Performance Tests' || '' }}
        - ✅ E2E Journey Tests
        - ✅ Security Scan
        
        ### Artifacts
        - Backend Test Results
        - Platform Test Results
        - Integration Test Results
        - Stress Test Results
        ${{ github.event.inputs.performance == 'true' || github.event_name == 'schedule' && '- Performance Test Results' || '' }}
        - E2E Test Results
        - Security Scan Results
        
        EOF
    
    - name: Upload final report
      uses: actions/upload-artifact@v3
      with:
        name: comprehensive-test-report
        path: final-report/
    
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('final-report/summary.md', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 🧪 Synapse Test Results\n\n${report}`
          });

  # Performance monitoring and alerting
  performance-monitor:
    runs-on: ubuntu-latest
    needs: [performance-tests]
    if: always() && (github.event.inputs.performance == 'true' || github.event_name == 'schedule')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Download performance results
      uses: actions/download-artifact@v3
      with:
        name: performance-test-results
        path: performance-results/
    
    - name: Analyze performance trends
      run: |
        echo "Analyzing performance trends..."
        # Compare with baseline performance
        # Alert on regressions
    
    - name: Create performance alert
      if: failure()
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: '🚨 Performance Regression Detected',
            body: 'Performance regression detected in build ${{ github.run_number }}. Please review performance test results.',
            labels: ['performance', 'regression']
          });

  # Clean up old artifacts
  cleanup:
    runs-on: ubuntu-latest
    needs: [test-report]
    if: always()
    
    steps:
    - name: Delete old artifacts
      uses: actions/github-script@v6
      with:
        script: |
          const artifacts = await github.rest.actions.listArtifactsForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });
          
          const oldArtifacts = artifacts.data.artifacts
            .filter(a => a.created_at < new Date(Date.now() - 7 * 24 * 60 * 60 * 1000))
            .map(a => a.id);
          
          if (oldArtifacts.length > 0) {
            for (const artifactId of oldArtifacts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifactId
              });
            }
            console.log(`Deleted ${oldArtifacts.length} old artifacts`);
          }