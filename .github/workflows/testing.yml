name: 🧪 Comprehensive Testing

on:
  workflow_call:

jobs:
  e2e-backend:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Setup Backend for E2E
      run: |
        cd back-end
        # Start test environment
        docker-compose -f docker-compose.test.yml up -d

        # Wait for services
        sleep 30

    - name: Run E2E Tests
      run: |
        cd back-end
        # Run E2E test suite
        mvn test -Dtest="*E2E" -Dspring.profiles.active=test

    - name: Cleanup
      if: always()
      run: |
        cd back-end
        docker-compose -f docker-compose.test.yml down

  performance-backend:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Setup Performance Testing
      run: |
        # Install JMeter or k6
        brew install jmeter

    - name: Run Performance Tests
      run: |
        cd back-end
        # Execute performance test suite
        jmeter -n -t performance-tests.jmx -l results.jtl

    - name: Generate Performance Report
      run: |
        echo "## ⚡ Backend Performance Results" >> $GITHUB_STEP_SUMMARY
        # Parse JMeter results and add to summary

  e2e-frontend:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Setup iOS E2E Testing
      run: |
        # Setup iOS simulator for E2E tests
        xcrun simctl create "TestDevice" "iPhone 15"
        xcrun simctl boot "TestDevice"

    - name: Run iOS E2E Tests
      run: |
        cd apple/Synapse
        # Run UI automation tests
        xcodebuild test \
          -scheme "Synapse iOS" \
          -destination "platform=iOS Simulator,id=TestDevice" \
          -only-testing:SynapseUITests

    - name: Cleanup Simulator
      if: always()
      run: |
        xcrun simctl shutdown "TestDevice"
        xcrun simctl delete "TestDevice"

