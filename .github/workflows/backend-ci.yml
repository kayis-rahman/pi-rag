name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'back-end/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'back-end/**'

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run Maven compile
      run: cd back-end && mvn compile -q

    - name: Run tests
      run: cd back-end && mvn test

    - name: Run code quality checks
      run: cd back-end && mvn spotbugs:check pmd:check checkstyle:check

    - name: Package application
      run: cd back-end && mvn package -DskipTests

    - name: Run OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'TimeBeam Backend'
        path: './back-end'
        format: 'ALL'
        args: >
          --enableRetired
          --enableExperimental
          --nvdValidForHours 24

    - name: Upload Dependency Check results
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-report
        path: reports/

    - name: Vulnerability Check Reminder
      run: |
        echo "🔍 Manual Step Required: Check vuldb.com for additional vulnerabilities"
        echo "1. Visit https://vuldb.com"
        echo "2. Search for vulnerabilities in:"
        echo "   - Spring Boot (${{ env.SPRING_VERSION }})"
        echo "   - PostgreSQL"
        echo "   - JWT libraries"
        echo "   - Other dependencies from pom.xml"
        echo "3. Update dependencies if critical vulnerabilities found"
      env:
        SPRING_VERSION: '3.2.0'

  sonarcloud:
    runs-on: self-hosted
    needs: build-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Analyze with SonarCloud
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        projectBaseDir: back-end/
