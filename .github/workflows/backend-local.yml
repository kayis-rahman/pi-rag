name: Backend Local Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  JAVA_VERSION: 17
  MAVEN_OPTS: "-Xmx1024m"

jobs:
  backend-build-test:
    name: 🧪 Backend Build & Test (Local)
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build backend
      run: |
        cd back-end
        mvn clean compile -DskipTests --batch-mode

    - name: Run backend unit tests
      run: |
        cd back-end
        mvn test -Dtest="*Test" -DfailIfNoTests=false --batch-mode

    - name: Run backend integration tests (H2)
      run: |
        cd back-end
        mvn test -Dtest="*IT" -DfailIfNoTests=false --batch-mode

    - name: Generate coverage report
      run: |
        cd back-end
        mvn jacoco:prepare-agent test jacoco:report --batch-mode

    - name: Generate test summary
      run: |
        cd back-end
        
        # Count total tests, failures, errors
        TOTAL_TESTS=$(find target/surefire-reports -name "*.xml" -exec grep -h "<testsuite" {} \; 2>/dev/null | sed 's/.*tests="\([^"]*\)".*/\1/g' | awk '{sum += $1} END {print sum}')
        TOTAL_FAILURES=$(find target/surefire-reports -name "*.xml" -exec grep -h "<testsuite" {} \; 2>/dev/null | sed 's/.*failures="\([^"]*\)".*/\1/g' | awk '{sum += $1} END {print sum}')
        TOTAL_ERRORS=$(find target/surefire-reports -name "*.xml" -exec grep -h "<testsuite" {} \; 2>/dev/null | sed 's/.*errors="\([^"]*\)".*/\1/g' | awk '{sum += $1} END {print sum}')
        
        echo "## 📊 Backend Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Total Tests:** ${TOTAL_TESTS:-0}" >> $GITHUB_STEP_SUMMARY
        echo "- **Failures:** ${TOTAL_FAILURES:-0}" >> $GITHUB_STEP_SUMMARY
        echo "- **Errors:** ${TOTAL_ERRORS:-0}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${TOTAL_FAILURES:-0}" -eq 0 ] && [ "${TOTAL_ERRORS:-0}" -eq 0 ]; then
          echo "✅ **Status:** PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Status:** FAILED" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-test-results
        path: |
          back-end/target/surefire-reports/
          back-end/target/site/jacoco/

  backend-docker-test:
    name: 🐳 Backend Docker Test
    runs-on: self-hosted
    if: github.event_name != 'pull_request' # Skip for PRs to save time
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        cd back-end
        docker build -t timebeam-backend:test .

    - name: Test with Docker Compose
      run: |
        cd back-end
        docker-compose up --abort-on-container-exit --exit-code-from backend || true
        docker-compose down
