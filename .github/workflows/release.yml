name: 🚀 Release & Deployment

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

jobs:
  prepare-release:
    runs-on: self-hosted

    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract version
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION="manual-${GITHUB_RUN_ID}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Generate changelog
      id: changelog
      run: |
        # Generate changelog from git history
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" $PREVIOUS_TAG..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --max-count=10)
          fi
        else
          CHANGELOG="Manual deployment"
        fi
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

  backend-release:
    needs: prepare-release
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'

    - name: Build production JAR
      run: |
        cd back-end
        mvn clean package -DskipTests -Pproduction

    - name: Create Docker image
      run: |
        cd back-end
        docker build -t synapse-backend:${{ needs.prepare-release.outputs.version }} .

    - name: Run production tests
      run: |
        cd back-end
        mvn test -Dspring.profiles.active=production

    - name: Tag and push Docker image
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      run: |
        docker tag synapse-backend:${{ needs.prepare-release.outputs.version }} ghcr.io/${{ github.repository }}/backend:${{ needs.prepare-release.outputs.version }}
        docker push ghcr.io/${{ github.repository }}/backend:${{ needs.prepare-release.outputs.version }}

        # Also tag as latest for main branch
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          docker tag synapse-backend:${{ needs.prepare-release.outputs.version }} ghcr.io/${{ github.repository }}/backend:latest
          docker push ghcr.io/${{ github.repository }}/backend:latest
        fi

  frontend-release:
    needs: prepare-release
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build iOS Release
      run: |
        cd apple/Synapse
        xcodebuild clean build \
          -scheme "Synapse iOS" \
          -configuration Release \
          -archivePath build/Synapse-iOS.xcarchive \
          archive

    - name: Build macOS Release
      run: |
        cd apple/Synapse
        xcodebuild clean build \
          -scheme "Synapse macOS" \
          -configuration Release \
          -archivePath build/Synapse-macOS.xcarchive \
          archive

    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts-${{ needs.prepare-release.outputs.version }}
        path: |
          apple/Synapse/build/
        retention-days: 90

  deploy-staging:
    if: github.ref == 'refs/heads/main' || inputs.environment == 'staging'
    needs: [prepare-release, backend-release, frontend-release]
    runs-on: self-hosted
    environment: staging

    steps:
    - name: Deploy to staging
      run: |
        echo "🚀 Deploying version ${{ needs.prepare-release.outputs.version }} to staging"
        # Add deployment commands here

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/') || inputs.environment == 'production'
    needs: [prepare-release, backend-release, frontend-release]
    runs-on: self-hosted
    environment: production

    steps:
    - name: Deploy to production
      run: |
        echo "🚀 Deploying version ${{ needs.prepare-release.outputs.version }} to production"
        # Add production deployment commands here

  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare-release, backend-release, frontend-release]
    runs-on: self-hosted

    steps:
    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ needs.prepare-release.outputs.version }}
        release_name: Release ${{ needs.prepare-release.outputs.version }}
        body: |
          ## Changes in this release

          ${{ needs.prepare-release.outputs.changelog }}

          ## Downloads

          - Backend Docker Image: `ghcr.io/${{ github.repository }}/backend:${{ needs.prepare-release.outputs.version }}`
          - iOS/macOS builds available in release artifacts
        draft: false
        prerelease: false