name: 🔍 Code Quality & Linting

on:
  workflow_call:

jobs:
  swift-lint:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint
      run: |
        cd apple/TimeBeam
        swiftlint --strict --reporter github-actions-logging

  java-lint:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'

    - name: Run Checkstyle
      run: |
        cd back-end
        mvn checkstyle:check

    - name: Run PMD
      run: |
        cd back-end
        mvn pmd:check

  format-check:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Install SwiftFormat
      run: brew install swiftformat

    - name: Check Swift Formatting
      run: |
        cd apple/TimeBeam
        swiftformat --lint --reporter github-actions-logging .

  lint-summary:
    runs-on: self-hosted
    needs: [swift-lint, java-lint, format-check]

    steps:
    - name: Lint Summary
      run: |
        echo "## 🔍 Code Quality Summary" >> $GITHUB_STEP_SUMMARY

        if [[ "${{ needs.swift-lint.result }}" == "success" ]]; then
          echo "✅ SwiftLint: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ SwiftLint: FAILED" >> $GITHUB_STEP_SUMMARY
        fi

        if [[ "${{ needs.java-lint.result }}" == "success" ]]; then
          echo "✅ Java Linting: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Java Linting: FAILED" >> $GITHUB_STEP_SUMMARY
        fi

        if [[ "${{ needs.format-check.result }}" == "success" ]]; then
          echo "✅ Code Formatting: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Code Formatting: FAILED" >> $GITHUB_STEP_SUMMARY
        fi

        if [[ "${{ needs.swift-lint.result }}" != "success" ]] || [[ "${{ needs.java-lint.result }}" != "success" ]] || [[ "${{ needs.format-check.result }}" != "success" ]]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔧 Fix linting issues before merging" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi