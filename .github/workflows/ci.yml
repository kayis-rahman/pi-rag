name: 🚀 CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Fast feedback (fail fast)
  lint:
    uses: ./.github/workflows/lint.yml

  # Parallel builds
  backend:
    uses: ./.github/workflows/backend.yml
    secrets: inherit

  frontend:
    uses: ./.github/workflows/frontend.yml
    secrets: inherit

  # Comprehensive testing
  testing:
    uses: ./.github/workflows/testing.yml
    needs: [backend, frontend]
    secrets: inherit

  # Security scanning
  security:
    uses: ./.github/workflows/security.yml
    needs: [backend, frontend]
    secrets: inherit

  # Quality gates (all must pass)
  quality-gate:
    runs-on: self-hosted
    needs: [lint, backend, frontend, testing, security]
    if: always()

    steps:
    - name: Final Quality Assessment
      run: |
        # Check all dependent jobs
        if [[ "${{ needs.lint.result }}" != "success" ]] ||
           [[ "${{ needs.backend.result }}" != "success" ]] ||
           [[ "${{ needs.frontend.result }}" != "success" ]] ||
           [[ "${{ needs.testing.result }}" != "success" ]] ||
           [[ "${{ needs.security.result }}" != "success" ]]; then

          echo "❌ Quality gates failed - blocking merge"
          echo "## 🚫 CI Pipeline Failed" >> $GITHUB_STEP_SUMMARY
          echo "One or more quality gates did not pass." >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

        echo "✅ All quality gates passed"
        echo "## ✅ CI Pipeline Successful" >> $GITHUB_STEP_SUMMARY
        echo "All checks passed - ready for merge." >> $GITHUB_STEP_SUMMARY