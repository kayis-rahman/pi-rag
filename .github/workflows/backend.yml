name: 🔧 Backend CI/CD

on:
  workflow_call:

env:
  JAVA_VERSION: 17
  MAVEN_OPTS: "-Xmx1024m"

jobs:
  build:
    runs-on: self-hosted
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: timebeam_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: maven

    - name: Build & Compile
      run: cd back-end && mvn clean compile -q

    - name: Unit Tests with Coverage
      run: cd back-end && mvn test jacoco:report

    - name: Integration Tests
      run: cd back-end && mvn verify -Dtest="*IT"

    - name: Code Quality Checks
      run: cd back-end && mvn spotbugs:check pmd:check checkstyle:check

    - name: Generate Reports
      run: |
        cd back-end
        mvn surefire-report:report
        mvn site -DgenerateReports=false

    - name: Test Results Summary
      run: |
        cd back-end

        # Parse comprehensive test metrics
        UNIT_TOTAL=$(find target/surefire-reports -name "*.xml" -exec grep -h "<testsuite" {} \; 2>/dev/null | sed 's/.*tests="\([^"]*\)".*/\1/g' | awk '{sum += $1} END {print sum+0}')
        UNIT_FAILED=$(find target/surefire-reports -name "*.xml" -exec grep -h "<testsuite" {} \; 2>/dev/null | sed 's/.*failures="\([^"]*\)".*/\1/g' | awk '{sum += $1} END {print sum+0}')
        IT_TOTAL=$(find target/surefire-reports -name "*IT.xml" -exec grep -h "<testsuite" {} \; 2>/dev/null | sed 's/.*tests="\([^"]*\)".*/\1/g' | awk '{sum += $1} END {print sum+0}')
        IT_FAILED=$(find target/surefire-reports -name "*IT.xml" -exec grep -h "<testsuite" {} \; 2>/dev/null | sed 's/.*failures="\([^"]*\)".*/\1/g' | awk '{sum += $1} END {print sum+0}')

        TOTAL_TESTS=$((UNIT_TOTAL + IT_TOTAL))
        TOTAL_FAILED=$((UNIT_FAILED + IT_FAILED))

        # Coverage calculation
        if [ -f "target/site/jacoco/jacoco.xml" ]; then
          COVERAGE=$(grep -oP '(?<=<counter type="LINE" missed=")[^"]*(?=" covered=")[^"]*' target/site/jacoco/jacoco.xml | awk '{missed += $1; covered += $2} END {total = missed + covered; if (total > 0) printf "%.1f", (covered/total)*100; else print "0.0"}')
        fi

        # Generate summary
        echo "## 🔧 Backend Test Results" >> $GITHUB_STEP_SUMMARY
        echo "| Category | Tests | Passed | Failed | Coverage |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-------|--------|--------|----------|" >> $GITHUB_STEP_SUMMARY
        echo "| Unit Tests | $UNIT_TOTAL | $((UNIT_TOTAL-UNIT_FAILED)) | $UNIT_FAILED | ${COVERAGE}% |" >> $GITHUB_STEP_SUMMARY
        echo "| Integration | $IT_TOTAL | $((IT_TOTAL-IT_FAILED)) | $IT_FAILED | - |" >> $GITHUB_STEP_SUMMARY
        echo "| **Total** | **$TOTAL_TESTS** | **$((TOTAL_TESTS-TOTAL_FAILED))** | **$TOTAL_FAILED** | **${COVERAGE}%** |" >> $GITHUB_STEP_SUMMARY

        if [ "$TOTAL_FAILED" -gt 0 ] || [ "${COVERAGE:-0}" -lt 85 ]; then
          echo "❌ Backend tests failed or coverage below 85%" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

        echo "✅ Backend tests passed with ${COVERAGE}% coverage" >> $GITHUB_STEP_SUMMARY

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-results-${{ github.run_id }}
        path: |
          back-end/target/surefire-reports/
          back-end/target/site/
          back-end/target/jacoco/
        retention-days: 30

    - name: SonarCloud Analysis
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        projectBaseDir: back-end/