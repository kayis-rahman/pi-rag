name: 🧪 Unit Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # Backend Unit Tests
  backend-unit:
    runs-on: [self-hosted, piwrom]
    name: Backend Unit Tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: timebeam_test
          POSTGRES_USER: timebeam_test
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Run Backend Unit Tests with Coverage
        id: backend-test
        run: |
          cd back-end
          echo "Running unit tests with JaCoCo coverage..."
          mvn clean test jacoco:report \
            -Dspring.profiles.active=test \
            -Dnet.bytebuddy.experimental=true \
            -q

      - name: Generate Backend Coverage Summary
        if: always()
        run: |
          cd back-end

          # Extract coverage from JaCoCo report
          if [ -f "target/site/jacoco/jacoco.xml" ]; then
            LINE_COVERAGE=$(grep -oP '(?<=type="LINE" missed=")[^"]*(?=" covered=")[^"]*' target/site/jacoco/jacoco.xml | awk '{missed+=$1; covered+=$2} END {total=missed+covered; if(total>0) printf "%.1f", (covered/total)*100; else print "0.0"}')
            BRANCH_COVERAGE=$(grep -oP '(?<=type="BRANCH" missed=")[^"]*(?=" covered=")[^"]*' target/site/jacoco/jacoco.xml | awk '{missed+=$1; covered+=$2} END {total=missed+covered; if(total>0) printf "%.1f", (covered/total)*100; else print "0.0"}')

            echo "## 📊 Backend Unit Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value | Target | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|--------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Line Coverage | ${LINE_COVERAGE}% | 80% | $(echo "${LINE_COVERAGE%.*}" | awk '{if($1>=80) print "✅"; else print "❌"}')" >> $GITHUB_STEP_SUMMARY
            echo "| Branch Coverage | ${BRANCH_COVERAGE}% | 75% | $(echo "${BRANCH_COVERAGE%.*}" | awk '{if($1>=75) print "✅"; else print "❌"}')" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Check thresholds
            LINE_CHECK=$(echo "${LINE_COVERAGE%.*}" | awk '{if($1>=80) print "PASS"; else print "FAIL"}')
            BRANCH_CHECK=$(echo "${BRANCH_COVERAGE%.*}" | awk '{if($1>=75) print "PASS"; else print "FAIL"}')

            if [ "$LINE_CHECK" = "FAIL" ] || [ "$BRANCH_CHECK" = "FAIL" ]; then
              echo "❌ Coverage thresholds not met!" >> $GITHUB_STEP_SUMMARY
              echo "- Line coverage: ${LINE_COVERAGE}% (target: 80%)" >> $GITHUB_STEP_SUMMARY
              echo "- Branch coverage: ${BRANCH_COVERAGE}% (target: 75%)" >> $GITHUB_STEP_SUMMARY
              exit 1
            else
              echo "✅ All coverage thresholds met!" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ JaCoCo coverage report not found!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload Backend Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.run_id }}
          path: |
            back-end/target/site/jacoco/
            back-end/target/jacoco.exec
          retention-days: 30

      - name: Upload Backend Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-results-${{ github.run_id }}
          path: back-end/target/surefire-reports/
          retention-days: 30

      - name: Upload Coverage to Codecov (Backend)
        if: success()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: back-end/target/site/jacoco/jacoco.xml
          flags: backend
          name: backend-unit-tests
          fail_ci_if_error: true
          verbose: true

  # iOS Unit Tests
  ios-unit:
    name: iOS Unit Tests
    runs-on: macos-latest

    strategy:
      matrix:
        include:
          - xcode: "15.2"
            destination: "iOS Simulator,name=iPhone 15,OS=17.2"
          - xcode: "15.2"
            destination: "iOS Simulator,name=iPhone 14,OS=16.5"
          - xcode: "15.2"
            destination: "iOS Simulator,name=iPhone SE (3rd generation),OS=17.2"
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Show Xcode Version
        run: |
          xcodebuild -version

      - name: Cache CocoaPods Dependencies
        uses: actions/cache@v3
        with:
          path: |
            apple/TimeBeam/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('apple/TimeBeam/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods Dependencies
        run: |
          cd apple/TimeBeam
          pod install --repo-update

      - name: Run iOS Unit Tests with Coverage
        id: ios-test
        run: |
          cd apple/TimeBeam

          echo "Running iOS unit tests with coverage..."
          xcodebuild test \
            -scheme "TimeBeam iOS" \
            -destination "${{ matrix.destination }}" \
            -enableCodeCoverage YES \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            ONLY_TESTING="TimeBeamTests"

      - name: Generate iOS Coverage Summary
        if: always()
        run: |
          cd apple/TimeBeam

          # Use xccov to extract coverage
          if [ -d "DerivedData/Logs/Test" ]; then
            COVERAGE_RESULT=$(xcrun xccov view --report --json DerivedData/Logs/Test/*.xcresult 2>/dev/null || echo "{}")

            echo "## 📱 iOS Unit Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Simulator | Destination | Tests | Passed | Failed | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------------|--------|--------|--------|----------|" >> $GITHUB_STEP_SUMMARY
            echo "| ${{ matrix.destination }} | ${{ matrix.destination }} | $(xcrun xccov view --report DerivedData/Logs/Test/*.xcresult 2>/dev/null | grep "tests:" | head -1) | - | - | TBD% |" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No test results found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload iOS Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unit-test-results-${{ matrix.xcode }}-${{ matrix.destination }}
          path: |
            apple/TimeBeam/DerivedData/Logs/Test/
            apple/TimeBeam/TestResults.xcresult
          retention-days: 30

      - name: Upload Coverage to Codecov (iOS)
        if: success()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apple/TimeBeam/DerivedData/Logs/Test/*.xcresult
          flags: ios
          name: ios-unit-tests
          fail_ci_if_error: false
          verbose: true

  # macOS Unit Tests
  macos-unit:
    name: macOS Unit Tests
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.2"

      - name: Cache CocoaPods Dependencies
        uses: actions/cache@v3
        with:
          path: |
            apple/TimeBeam/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('apple/TimeBeam/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods Dependencies
        run: |
          cd apple/TimeBeam
          pod install --repo-update

      - name: Run macOS Unit Tests with Coverage
        id: macos-test
        run: |
          cd apple/TimeBeam

          echo "Running macOS unit tests with coverage..."
          xcodebuild test \
            -scheme "TimeBeam macOS" \
            -destination "platform=macOS" \
            -enableCodeCoverage YES \
            -derivedDataPath DerivedData-macOS \
            -resultBundlePath TestResults-macOS.xcresult

      - name: Generate macOS Coverage Summary
        if: always()
        run: |
          cd apple/TimeBeam

          echo "## 💻 macOS Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d "DerivedData-macOS/Logs/Test" ]; then
            echo "✅ macOS tests completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No test results found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload macOS Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-unit-test-results-${{ github.run_id }}
          path: |
            apple/TimeBeam/DerivedData-macOS/Logs/Test/
            apple/TimeBeam/TestResults-macOS.xcresult
          retention-days: 30

      - name: Upload Coverage to Codecov (macOS)
        if: success()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apple/TimeBeam/DerivedData-macOS/Logs/Test/*.xcresult
          flags: macos
          name: macos-unit-tests
          fail_ci_if_error: false
          verbose: true
