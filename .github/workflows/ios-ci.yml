name: iOS CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apple/**'
      - 'TimeBeamShared/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apple/**'
      - 'TimeBeamShared/**'

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Cache Swift packages
      uses: actions/cache@v4
      with:
        path: ~/.swiftpm
        key: ${{ runner.os }}-swiftpm-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
        restore-keys: ${{ runner.os }}-swiftpm

    - name: Run SwiftLint
      run: |
        cd apple/TimeBeam
        swiftlint --strict --reporter github-actions-logging

    - name: Build TimeBeam iOS
      run: |
        cd apple/TimeBeam
        xcodebuild clean build \
          -scheme "TimeBeam iOS" \
          -destination "generic/platform=iOS" \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO

    - name: Build TimeBeam macOS
      run: |
        cd apple/TimeBeam
        xcodebuild clean build \
          -scheme "TimeBeam macOS" \
          -destination "generic/platform=macOS" \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO

    - name: Run tests
      run: |
        cd apple/TimeBeam
        xcodebuild test \
          -scheme "TimeBeam iOS" \
          -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
          -configuration Debug \
          CODE_SIGNING_ALLOWED=NO

  swift-package-test:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Test TimeBeamShared
      run: |
        cd TimeBeamShared
        swift test

  vulnerability-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check for known Swift vulnerabilities
      run: |
        echo "🔍 Manual Step Required: Check vuldb.com for Swift/iOS vulnerabilities"
        echo "1. Visit https://vuldb.com"
        echo "2. Search for vulnerabilities in:"
        echo "   - SwiftUI"
        echo "   - Combine"
        echo "   - URLSession"
        echo "   - Keychain APIs"
        echo "   - Any third-party SPM packages"
        echo "3. Check Apple Security Advisories: https://support.apple.com/en-us/HT201222"
        echo "4. Update Xcode and Swift versions if needed"

    - name: Check for outdated dependencies
      run: |
        echo "Checking for outdated Swift packages..."
        # This is a placeholder - in a real scenario, you might use a tool like swift-outdated
        find . -name "Package.swift" -exec echo "Found Package.swift: {}" \;
