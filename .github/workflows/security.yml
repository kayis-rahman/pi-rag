name: 🔒 Security Scanning

on:
  workflow_call:

jobs:
  automated-security:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    # Backend Security
    - name: OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'Synapse Backend'
        path: './back-end'
        format: 'ALL'
        args: >
          --enableRetired
          --enableExperimental
          --nvdValidForHours 24

    - name: Backend Container Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './back-end'
        format: 'sarif'
        output: 'trivy-backend.sarif'

    # Frontend Security
    - name: iOS Security Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './apple'
        format: 'sarif'
        output: 'trivy-ios.sarif'

    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports-${{ github.run_id }}
        path: |
          reports/
          trivy-backend.sarif
          trivy-ios.sarif
        retention-days: 30

    - name: Security Summary
      run: |
        echo "## 🔒 Automated Security Scan Results" >> $GITHUB_STEP_SUMMARY

        # Parse OWASP results
        CRITICAL=$(grep -c "CRITICAL" reports/dependency-check-report.html 2>/dev/null || echo "0")
        HIGH=$(grep -c "HIGH" reports/dependency-check-report.html 2>/dev/null || echo "0")

        echo "### Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Critical: $CRITICAL" >> $GITHUB_STEP_SUMMARY
        echo "- High: $HIGH" >> $GITHUB_STEP_SUMMARY

        if [ "$CRITICAL" -gt 0 ]; then
          echo "🚨 Critical vulnerabilities found - review required" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

        echo "✅ No critical vulnerabilities found" >> $GITHUB_STEP_SUMMARY

    - name: Manual Security Review Checklist
      run: |
        echo "## 📋 Manual Security Review Required" >> $GITHUB_STEP_SUMMARY
        echo "### Backend Security" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Review Spring Boot version: ${{ env.SPRING_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Check PostgreSQL security advisories" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Verify JWT token handling" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Review custom exception handling" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### iOS Security" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Check Apple Security Advisories" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Verify code signing certificates" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Review Keychain usage" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Check third-party SPM dependencies" >> $GITHUB_STEP_SUMMARY