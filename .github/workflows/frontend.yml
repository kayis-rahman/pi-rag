name: 📱 Frontend CI/CD

on:
  workflow_call:

env:
  XCODE_VERSION: latest-stable

jobs:
  ios:
    runs-on: self-hosted
    strategy:
      matrix:
        config: [Debug, Release]
        include:
          - config: Debug
            test: true
          - config: Release
            test: false

    steps:
    - uses: actions/checkout@v4

    - name: Setup Xcode ${{ env.XCODE_VERSION }}
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XCODE_VERSION }}

    - name: Cache Swift PM
      uses: actions/cache@v4
      with:
        path: ~/.swiftpm
        key: ${{ runner.os }}-swiftpm-${{ hashFiles('**/Package.swift') }}

    - name: Install Tools
      run: |
        brew install swiftlint
        brew install chargepoint/xcparse/xcresultparser
        brew install swiftcov

    - name: SwiftLint
      run: cd apple/TimeBeam && swiftlint --strict --reporter github-actions-logging

    - name: Build iOS ${{ matrix.config }}
      run: |
        cd apple/TimeBeam
        xcodebuild clean build \
          -scheme "TimeBeam iOS" \
          -configuration ${{ matrix.config }} \
          -destination "generic/platform=iOS" \
          CODE_SIGNING_ALLOWED=NO

    - name: Test iOS (Debug only)
      if: matrix.test
      run: |
        cd apple/TimeBeam
        xcodebuild test \
          -scheme "TimeBeam iOS" \
          -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
          -configuration Debug \
          -resultBundlePath TestResults \
          -enableCodeCoverage YES \
          CODE_SIGNING_ALLOWED=NO

    - name: Parse iOS Test Results
      if: matrix.test
      run: |
        cd apple/TimeBeam

        # Parse test results
        xcresultparser TestResults.xcresult > test-results.json

        TESTS=$(jq '.metrics.tests.count' test-results.json)
        PASSED=$(jq '.metrics.tests.passed' test-results.json)
        FAILED=$(jq '.metrics.tests.failed' test-results.json)
        COVERAGE=$(swiftcov coverage --input TestResults.xcresult 2>/dev/null || echo "0.0")

        echo "## 📱 iOS Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- Tests: $TESTS" >> $GITHUB_STEP_SUMMARY
        echo "- Passed: $PASSED" >> $GITHUB_STEP_SUMMARY
        echo "- Failed: $FAILED" >> $GITHUB_STEP_SUMMARY
        echo "- Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY

        if [ "$FAILED" -gt 0 ] || [ "${COVERAGE%.*}" -lt 80 ]; then
          echo "❌ iOS tests failed or coverage below 80%" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Upload iOS Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ios-${{ matrix.config }}-${{ github.run_id }}
        path: |
          apple/TimeBeam/build/
          apple/TimeBeam/TestResults.xcresult/
          apple/TimeBeam/test-results.json
        retention-days: ${{ matrix.config == 'Release' && 30 || 7 }}

  macos:
    runs-on: self-hosted
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XCODE_VERSION }}

    - name: Build macOS ${{ matrix.config }}
      run: |
        cd apple/TimeBeam
        xcodebuild clean build \
          -scheme "TimeBeam macOS" \
          -configuration ${{ matrix.config }} \
          -destination "generic/platform=macOS" \
          CODE_SIGNING_ALLOWED=NO

    - name: Upload macOS Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-${{ matrix.config }}-${{ github.run_id }}
        path: apple/TimeBeam/build/
        retention-days: ${{ matrix.config == 'Release' && 30 || 7 }}

  shared:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XCODE_VERSION }}

    - name: Test Shared Components
      run: |
        cd TimeBeamShared
        swift test --enable-code-coverage
        swift test --generate-linuxmain

    - name: Upload Shared Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: shared-tests-${{ github.run_id }}
        path: TimeBeamShared/.build/
        retention-days: 30