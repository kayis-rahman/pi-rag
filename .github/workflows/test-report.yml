name: 📊 Test Report Aggregation

on:
  workflow_run:
    workflows: [test-unit, test-integration]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Actions Run ID to report'
        required: true

env:
  COVERAGE_THRESHOLD_LINE: 80
  COVERAGE_THRESHOLD_BRANCH: 75

jobs:
  # Download and Aggregate Results
  aggregate-results:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'skipped'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Backend Artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          path: artifacts/backend

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          path: artifacts/ios

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          path: artifacts/macos

      - name: Download Integration Artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          path: artifacts/integration

      - name: Parse Backend Test Results
        id: backend-results
        run: |
          echo "## Parsing backend test results..." >> $GITHUB_STEP_SUMMARY

          UNIT_RESULTS=$(find artifacts/backend -name "*.xml" -path "*/surefire-reports/*" | head -1)
          COVERAGE_XML=$(find artifacts/backend -name "jacoco.xml" | head -1)

          if [ -f "$UNIT_RESULTS" ]; then
            # Parse surefire XML
            BACKEND_UNIT_TOTAL=$(grep -h "<testsuite" "$UNIT_RESULTS" | sed 's/.*tests="\([^"]*\)".*/\1/g' | awk '{sum += $1} END {print sum+0}')
            BACKEND_UNIT_FAILED=$(grep -h "<testsuite" "$UNIT_RESULTS" | sed 's/.*failures="\([^"]*\)".*/\1/g' | awk '{sum += $1} END {print sum+0}')
            BACKEND_UNIT_PASSED=$((BACKEND_UNIT_TOTAL - BACKEND_UNIT_FAILED))

            echo "backend_unit_total=$BACKEND_UNIT_TOTAL" >> $GITHUB_OUTPUT
            echo "backend_unit_failed=$BACKEND_UNIT_FAILED" >> $GITHUB_OUTPUT
            echo "backend_unit_passed=$BACKEND_UNIT_PASSED" >> $GITHUB_OUTPUT
          else
            echo "backend_unit_total=0" >> $GITHUB_OUTPUT
            echo "backend_unit_failed=0" >> $GITHUB_OUTPUT
            echo "backend_unit_passed=0" >> $GITHUB_OUTPUT
          fi

          if [ -f "$COVERAGE_XML" ]; then
            # Parse JaCoCo XML
            BACKEND_LINE_COV=$(grep -oP '(?<=type="LINE" missed=")[^"]*(?=" covered=")[^"]*' "$COVERAGE_XML" | awk '{missed+=$1; covered+=$2} END {total=missed+covered; if(total>0) printf "%.1f", (covered/total)*100; else print "0.0"}')
            BACKEND_BRANCH_COV=$(grep -oP '(?<=type="BRANCH" missed=")[^"]*(?=" covered=")[^"]*' "$COVERAGE_XML" | awk '{missed+=$1; covered+=$2} END {total=missed+covered; if(total>0) printf "%.1f", (covered/total)*100; else print "0.0"}')

            echo "backend_line_cov=$BACKEND_LINE_COV" >> $GITHUB_OUTPUT
            echo "backend_branch_cov=$BACKEND_BRANCH_COV" >> $GITHUB_OUTPUT
          else
            echo "backend_line_cov=0" >> $GITHUB_OUTPUT
            echo "backend_branch_cov=0" >> $GITHUB_OUTPUT
          fi

      - name: Parse iOS Test Results
        id: ios-results
        run: |
          echo "## Parsing iOS test results..." >> $GITHUB_STEP_SUMMARY

          # Find all xcresult bundles
          IOS_RESULTS=$(find artifacts/ios -name "*.xcresult" 2>/dev/null)

          if [ -n "$IOS_RESULTS" ]; then
            # Count iOS test results
            IOS_TOTAL=$(xcrun xccov view --json $IOS_RESULTS 2>/dev/null | jq '.lineCoverage' | awk '{printf "%.1f", $1*100}' || echo "0.0")
            IOS_TESTS=$(find artifacts/ios -name "*.xcresult" | wc -l)

            echo "ios_tests=$IOS_TESTS" >> $GITHUB_OUTPUT
            echo "ios_coverage=$IOS_TOTAL" >> $GITHUB_OUTPUT
          else
            echo "ios_tests=0" >> $GITHUB_OUTPUT
            echo "ios_coverage=0" >> $GITHUB_OUTPUT
          fi

      - name: Parse macOS Test Results
        id: macos-results
        run: |
          echo "## Parsing macOS test results..." >> $GITHUB_STEP_SUMMARY

          MACOS_RESULTS=$(find artifacts/macos -name "*.xcresult" 2>/dev/null)

          if [ -n "$MACOS_RESULTS" ]; then
            MACOS_TOTAL=$(xcrun xccov view --json $MACOS_RESULTS 2>/dev/null | jq '.lineCoverage' | awk '{printf "%.1f", $1*100}' || echo "0.0")
            MACOS_TESTS=$(find artifacts/macos -name "*.xcresult" | wc -l)

            echo "macos_tests=$MACOS_TESTS" >> $GITHUB_OUTPUT
            echo "macos_coverage=$MACOS_TOTAL" >> $GITHUB_OUTPUT
          else
            echo "macos_tests=0" >> $GITHUB_OUTPUT
            echo "macos_coverage=0" >> $GITHUB_OUTPUT
          fi

      - name: Generate Comprehensive Summary
        id: summary
        run: |
          echo "# 🧪 TimeBeam Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID:** ${{ inputs.run_id || github.event.workflow_run.id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Backend Section
          echo "## 🔧 Backend Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | Total | Passed | Failed | Coverage | Target |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|--------|--------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ steps.backend-results.outputs.backend_unit_total }} | ${{ steps.backend-results.outputs.backend_unit_passed }} | ${{ steps.backend-results.outputs.backend_unit_failed }} | ${{ steps.backend-results.outputs.backend_line_cov }}% | ${{ env.COVERAGE_THRESHOLD_LINE }}% |" >> $GITHUB_STEP_SUMMARY

          # iOS Section
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📱 iOS Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | Tests | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ steps.ios-results.outputs.ios_tests }} | ${{ steps.ios-results.outputs.ios_coverage }}% |" >> $GITHUB_STEP_SUMMARY

          # macOS Section
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 💻 macOS Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | Tests | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ steps.macos-results.outputs.macos_tests }} | ${{ steps.macos-results.outputs.macos_coverage }}% |" >> $GITHUB_STEP_SUMMARY

          # Overall Status
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Overall Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check coverage thresholds
          BACKEND_COV_CHECK=$(echo "${{ steps.backend-results.outputs.backend_line_cov }}" | awk '{if($1>=${{ env.COVERAGE_THRESHOLD_LINE }}) print "PASS"; else print "FAIL"}')

          if [ "$BACKEND_COV_CHECK" = "PASS" ]; then
            echo "- ✅ Backend coverage meets threshold (${{ steps.backend-results.outputs.backend_line_cov }}% >= ${{ env.COVERAGE_THRESHOLD_LINE }}%)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Backend coverage below threshold (${{ steps.backend-results.outputs.backend_line_cov }}% < ${{ env.COVERAGE_THRESHOLD_LINE }}%)" >> $GITHUB_STEP_SUMMARY
          fi

          # Check test failures
          TOTAL_FAILED=$((steps.backend-results.outputs.backend_unit_failed))
          if [ "$TOTAL_FAILED" -eq 0 ]; then
            echo "- ✅ All tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ $TOTAL_FAILED test(s) failed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const summary = require('fs').readFileSync(process.env.GITHUB_STEP_SUMMARY, 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Generate HTML Report
        run: |
          mkdir -p report

          cat > report/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>TimeBeam Test Report</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
                  h1 { color: #333; }
                  h2 { color: #555; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
                  table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
                  th, td { padding: 12px; text-align: left; border: 1px solid #ddd; }
                  th { background-color: #f4f4f4; }
                  .pass { color: green; font-weight: bold; }
                  .fail { color: red; font-weight: bold; }
              </style>
          </head>
          <body>
              <h1>🧪 TimeBeam Test Report</h1>
              <p><strong>Run ID:</strong> ${{ inputs.run_id || github.event.workflow_run.id }}</p>
              <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
              <p><strong>Commit:</strong> <code>${{ github.sha }}</code></p>

              <h2>🔧 Backend Test Results</h2>
              <table>
                  <tr>
                      <th>Test Type</th>
                      <th>Total</th>
                      <th>Passed</th>
                      <th>Failed</th>
                      <th>Coverage</th>
                      <th>Target</th>
                  </tr>
                  <tr>
                      <td>Unit Tests</td>
                      <td>${{ steps.backend-results.outputs.backend_unit_total }}</td>
                      <td>${{ steps.backend-results.outputs.backend_unit_passed }}</td>
                      <td>${{ steps.backend-results.outputs.backend_unit_failed }}</td>
                      <td>${{ steps.backend-results.outputs.backend_line_cov }}%</td>
                      <td>${{ env.COVERAGE_THRESHOLD_LINE }}%</td>
                  </tr>
              </table>

              <h2>📱 iOS Test Results</h2>
              <table>
                  <tr>
                      <th>Test Type</th>
                      <th>Tests</th>
                      <th>Coverage</th>
                  </tr>
                  <tr>
                      <td>Unit Tests</td>
                      <td>${{ steps.ios-results.outputs.ios_tests }}</td>
                      <td>${{ steps.ios-results.outputs.ios_coverage }}%</td>
                  </tr>
              </table>

              <h2>💻 macOS Test Results</h2>
              <table>
                  <tr>
                      <th>Test Type</th>
                      <th>Tests</th>
                      <th>Coverage</th>
                  </tr>
                  <tr>
                      <td>Unit Tests</td>
                      <td>${{ steps.macos-results.outputs.macos_tests }}</td>
                      <td>${{ steps.macos-results.outputs.macos_coverage }}%</td>
                  </tr>
              </table>
          </body>
          </html>
          EOF

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: test-report-html-${{ inputs.run_id || github.event.workflow_run.id }}
          path: report/index.html
          retention-days: 90
