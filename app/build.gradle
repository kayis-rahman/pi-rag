plugins {
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

group = 'com.synapse'
version = '1.0.0'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    springAiVersion = '1.0.0'
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' } // For potential Qdrant client if needed
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
    maven {
        name = 'Central Portal Snapshots'
        url = 'https://central.sonatype.com/repository/maven-snapshots/'
    }
}

dependencies {
    // Spring Boot Dependencies
    implementation 'org.springframework.boot:spring-boot-starter'
//    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
//    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // For gRPC communication
    implementation 'io.grpc:grpc-netty-shaded:1.75.0'
    implementation 'io.grpc:grpc-protobuf:1.58.0'
    implementation 'io.grpc:grpc-stub:1.58.0'

    // Netty DNS native library for macOS
    implementation 'io.netty:netty-resolver-dns-native-macos:4.1.118.Final:osx-aarch_64'

    // For Redis integration
//    implementation 'redis.clients:jedis:4.4.6'
//    implementation 'org.springframework.data:spring-data-redis:3.2.0'

    implementation 'io.qdrant:client:1.17.0'

    // For SQLite database
//    implementation 'org.xerial:sqlite-jdbc:3.42.0.0'
//    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    // Spring AI Dependencies
    implementation platform("org.springframework.ai:spring-ai-bom:${springAiVersion}")
    implementation 'org.springframework.ai:spring-ai-openai'
    implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}