plugins {
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

group = 'com.synapse'
version = '1.0.0'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    springAiVersion = '1.0.0'
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' } // For potential Qdrant client if needed
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
    maven {
        name = 'Central Portal Snapshots'
        url = 'https://central.sonatype.com/repository/maven-snapshots/'
    }
}

dependencies {
    // Spring Boot Dependencies
    implementation 'org.springframework.boot:spring-boot-starter'
//    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
//    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // For gRPC communication
    implementation 'io.grpc:grpc-netty-shaded:1.75.0'
    implementation 'io.grpc:grpc-protobuf:1.58.0'
    implementation 'io.grpc:grpc-stub:1.58.0'

    // Netty DNS native library for macOS
    implementation 'io.netty:netty-resolver-dns-native-macos:4.1.118.Final:osx-aarch_64'

    // For Redis integration
//    implementation 'redis.clients:jedis:4.4.6'
//    implementation 'org.springframework.data:spring-data-redis:3.2.0'

    implementation 'io.qdrant:client:1.17.0'

    // For SQLite database
//    implementation 'org.xerial:sqlite-jdbc:3.42.0.0'
//    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    // Spring AI Dependencies
    implementation platform("org.springframework.ai:spring-ai-bom:${springAiVersion}")
    implementation 'org.springframework.ai:spring-ai-openai'
    implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'

    // LangChain4j Dependencies
    implementation 'dev.langchain4j:langchain4j-core:0.36.2'
    implementation 'dev.langchain4j:langchain4j-open-ai:0.36.2'          // For OpenAI-compatible vLLM (Qwen)
    implementation 'dev.langchain4j:langchain4j-anthropic:0.36.2'        // For Claude API

    // Resilience4j Circuit Breaker
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// ============================================================================
// End-to-End Testing Task
// ============================================================================
task e2e {
    description = 'Run end-to-end integration tests for the routing system'
    group = 'verification'
    dependsOn 'build'
    doLast {
        println """
╔════════════════════════════════════════════════════════════════╗
║     Synapse Intelligent Routing System - E2E Tests             ║
╚════════════════════════════════════════════════════════════════╝

Running E2E test suite...
        """

        // Run all integration tests
        test.testClassesDirs.each { dir ->
            def testFiles = fileTree(dir).include('**/*IntegrationTest.class', '**/*E2E*Test.class')
            println "📋 Found ${testFiles.size()} test classes:"
            testFiles.each { println "   ✓ ${it.name}" }
        }

        test {
            useJUnitPlatform()
            filter {
                includeTestsMatching '*IntegrationTest'
                includeTestsMatching '*E2E*'
            }
        }
    }
}

// E2E test with curl validation
task e2eValidation {
    description = 'Run E2E tests with HTTP endpoint validation'
    group = 'verification'
    dependsOn 'build'
    doLast {
        println """
╔════════════════════════════════════════════════════════════════╗
║          E2E Endpoint Validation (requires running app)        ║
╚════════════════════════════════════════════════════════════════╝

Test 1: Code Detection (should route to QWEN_LOCAL)
        """
        def cmd1 = 'curl -s http://localhost:8080/api/chat/sync -X POST -H "Content-Type: application/json" -d \'{"model":"auto","content":"How do I write python code?"}\' | jq \'.routing_decision\''
        def result1 = cmd1.execute().text
        println result1

        println """
Test 2: Complex Query (should route to CLAUDE_API)
        """
        def cmd2 = 'curl -s http://localhost:8080/api/chat/sync -X POST -H "Content-Type: application/json" -d \'{"model":"auto","content":"Explain quantum mechanics"}\' | jq \'.routing_decision\''
        def result2 = cmd2.execute().text
        println result2

        println """
Test 3: Anthropic API Format - content as string (/v1/messages)
        """
        def cmd3 = '''curl -s http://localhost:8080/v1/messages -X POST -H "Content-Type: application/json" -d '{"model":"claude-3-5-sonnet-20241022","messages":[{"role":"user","content":"Hello"}],"max_tokens":1024}' | jq '.content[0].text' '''
        def result3 = cmd3.execute().text
        println result3

        println """
Test 4: Anthropic API Format - content as array (Claude Code format) (/v1/messages)
        """
        def cmd4 = '''curl -s http://localhost:8080/v1/messages -X POST -H "Content-Type: application/json" -d '{"model":"claude-3-5-sonnet-20241022","messages":[{"role":"user","content":[{"type":"text","text":"Hello from Claude Code"}]}],"max_tokens":1024}' | jq '.content[0].text' '''
        def result4 = cmd4.execute().text
        println result4

        println """
Test 5: Anthropic API Format - multi-turn with array content (/v1/messages)
        """
        def cmd5 = '''curl -s http://localhost:8080/v1/messages -X POST -H "Content-Type: application/json" -d '{"model":"claude-3-5-sonnet-20241022","messages":[{"role":"user","content":[{"type":"text","text":"Write a Python function"}]}],"max_tokens":1024}' | jq '.stop_reason' '''
        def result5 = cmd5.execute().text
        println result5

        println """
✅ E2E validation complete!
Make sure app is running with: ./gradlew bootRun
        """
    }
}

// Quick smoke test
task e2eSmoke {
    description = 'Quick smoke test of routing endpoints'
    group = 'verification'
    doLast {
        println """
╔════════════════════════════════════════════════════════════════╗
║               Synapse E2E Smoke Test                           ║
╚════════════════════════════════════════════════════════════════╝
        """

        def testCases = [
            [name: 'Short Query', query: 'hello', expect: 'short_query'],
            [name: 'Code Task', query: 'How do I write python code for a function', expect: 'code_task'],
            [name: 'Simple Retrieval', query: 'What is the capital of France', expect: 'simple_retrieval']
        ]

        def passed = 0
        def failed = 0

        testCases.each { test ->
            print "Testing ${test.name}... "
            try {
                def json = new groovy.json.JsonOutput().toJson([model: 'auto', content: test.query])
                def cmd = ["bash", "-c", "curl -s http://localhost:8080/api/chat/sync -X POST -H 'Content-Type: application/json' -d '${json}' | jq -r '.routing_decision.reason'"]
                def result = cmd.execute().text.trim()

                if (result == test.expect) {
                    println "✅ PASS (${result})"
                    passed++
                } else {
                    println "❌ FAIL (expected: ${test.expect}, got: ${result})"
                    failed++
                }
            } catch (Exception e) {
                println "❌ ERROR: ${e.message}"
                failed++
            }
        }

        println ""
        println "Results: ${passed} passed, ${failed} failed"
        if (failed > 0) {
            println "⚠️  Make sure app is running: ./gradlew bootRun"
        }
    }
}
