server:
  port: 8080
  # Reactor Netty configuration to suppress TCP_NODELAY warning on macOS
  netty:
    pool:
      max-idle-time: 30000

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:your-api-key-here}

# LangChain4j Router Configuration
synapse:
  llm:
    qwen:
      base-url: http://localhost:8000/v1
      model-name: Qwen/Qwen3.5-35B-Instruct
      api-key: "not-needed"                    # vLLM doesn't require auth
      timeout-seconds: 60
    claude:
      api-key: ${ANTHROPIC_API_KEY}
      model-name: claude-3-5-sonnet-20241022
      timeout-seconds: 120
    claude-haiku:
      api-key: ${ANTHROPIC_API_KEY}
      model-name: claude-haiku-4-5-20251001
      timeout-seconds: 60
    routing:
      max-local-tokens: 4096
      short-query-threshold: 20
      code-keywords: [class, def, public, function, interface, return, import, async, await]
      complex-keywords: [implement, refactor, debug, architect, design, analyze, migrate, optimize, review, build]
      simple-keywords: [what is, define, list the, explain, summarize, how many, is this, yes or no]
    circuit-breaker:
      enabled: true
      failure-rate-threshold: 50                # Open circuit at 50% failure rate
      slow-call-duration-threshold-ms: 5000    # Call > 5s counts as slow
      wait-duration-in-open-state-ms: 30000    # Wait 30s before half-open probe
      permitted-calls-in-half-open: 3          # Allow 3 calls in half-open state
      min-calls-before-evaluation: 5            # Need 5 calls before threshold check

llm:
  model_list:
    - model_name: claude-sonnet-4-6
      api_key: ${GPUHUB_API_KEY:"test-key"}
      instances:
        - instance_id: vllm-primary
          api_base: https://u425-twwp-6d5643db.singapore-b.gpuhub.com:8443/v1
          enabled: true
          is_primary: true
        - instance_id: vllm-backup
          api_base: https://u425-u70w-e4420dcd.singapore-b.gpuhub.com:8443/v1
          enabled: true
          is_primary: false
    - model_name: claude-sonnet-4-5-20251022
      api_key: ${GPUHUB_API_KEY:"test-key"}
      instances:
        - instance_id: vllm-primary
          api_base: https://u425-twwp-6d5643db.singapore-b.gpuhub.com:8443/v1
          enabled: true
          is_primary: true
        - instance_id: vllm-backup
          api_base: https://u425-u70w-e4420dcd.singapore-b.gpuhub.com:8443/v1
          enabled: true
          is_primary: false
    - model_name: claude-sonnet-4-5
      api_key: ${GPUHUB_API_KEY:"test-key"}
      instances:
        - instance_id: vllm-primary
          api_base: https://u425-twwp-6d5643db.singapore-b.gpuhub.com:8443/v1
          enabled: true
          is_primary: true
        - instance_id: vllm-backup
          api_base: https://u425-u70w-e4420dcd.singapore-b.gpuhub.com:8443/v1
          enabled: true
          is_primary: false
    - model_name: claude-haiku-4-5-20251001
      api_key: ${GPUHUB_API_KEY:"test-key"}
      instances:
        - instance_id: vllm-primary
          api_base: https://u425-twwp-6d5643db.singapore-b.gpuhub.com:8443/v1
          enabled: true
          is_primary: true
        - instance_id: vllm-backup
          api_base: https://u425-u70w-e4420dcd.singapore-b.gpuhub.com:8443/v1
          enabled: true
          is_primary: false
    - model_name: claude-haiku-4-5
      api_key: ${GPUHUB_API_KEY:"test-key"}
      instances:
        - instance_id: vllm-primary
          api_base: https://u425-twwp-6d5643db.singapore-b.gpuhub.com:8443/v1
          enabled: true
          is_primary: true
        - instance_id: vllm-backup
          api_base: https://u425-u70w-e4420dcd.singapore-b.gpuhub.com:8443/v1
          enabled: true
          is_primary: false
  litellm_settings:
    drop_params: true
    set_verbose: false
  general_settings:
    disable_cooldowns: true
  settings:
    default-model: claude-sonnet-4-6
  routing:
    enabled: true
    servers:
      small:
        instance-id: local-mlx-qwen
        api-base: http://127.0.0.1:8888/v1
        api-key: local-test-key
        served-model-name: Qwen/Qwen3-1.7B-MLX-4bit
      large:
        instance-id: local-mlx-qwen
        api-base: http://127.0.0.1:8888/v1
        api-key: local-test-key
        served-model-name: Qwen/Qwen3-1.7B-MLX-4bit
    model-tier-map:
      claude-sonnet-4-6: LARGE
      claude-sonnet-4-5-20251022: LARGE
      claude-sonnet-4-5: LARGE
      claude-haiku-4-5-20251001: SMALL
      claude-haiku-4-5: SMALL
    rules:
      max-small-tokens: 500
      max-small-words: 30
