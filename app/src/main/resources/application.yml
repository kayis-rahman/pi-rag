server:
  port: 8082
  # Reactor Netty configuration to suppress TCP_NODELAY warning on macOS
  netty:
    pool:
      max-idle-time: 30000

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/synapse
    username: synapse_user
    password: synapse_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:your-api-key-here}
  codec:
    max-in-memory-size: -1
  web:
    resources:
      add-mappings: false
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    jedis:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5

# LangChain4j Router Configuration
synapse:
  logging:
    trace-file: logs/synapse-trace.log
  llm:
    qwen:
      server-url: https://u425-u70w-e4420dcd.singapore-b.gpuhub.com:8443 #Server A (haiku)
#      secondary-server-url: https://u425-u70w-e4420dcd.singapore-b.gpuhub.com:8443 # Server B (sonnet)
      secondary-server-url: https://u425-c9xl-2793be5c.singapore-b.gpuhub.com:8443 # Server B (sonnet)
      model-name: claude-haiku-4-5
      secondary-model-name: claude-sonnet-4-6
      max-output-tokens: 8192
      api-key: "not-needed"                    # vLLM doesn't require auth
      timeout-seconds: 60
    claude:
      api-key: ${ANTHROPIC_API_KEY}
      model-name: claude-3-5-sonnet-20241022
      timeout-seconds: 120
    claude-haiku:
      api-key: ${ANTHROPIC_API_KEY}
      model-name: claude-haiku-4-5-20251001
      timeout-seconds: 60
    routing:
      max-local-tokens: 4096
      short-query-threshold: 20
      code-keywords: [class, def, public, function, interface, return, import, async, await]
      complex-keywords: [implement, refactor, debug, architect, design, analyze, migrate, optimize, review, build]
      simple-keywords: [what is, define, list the, explain, summarize, how many, is this, yes or no]
    circuit-breaker:
      enabled: true
      failure-rate-threshold: 50                # Open circuit at 50% failure rate
      slow-call-duration-threshold-ms: 5000    # Call > 5s counts as slow
      wait-duration-in-open-state-ms: 30000    # Wait 30s before half-open probe
      permitted-calls-in-half-open: 3          # Allow 3 calls in half-open state
      min-calls-before-evaluation: 5            # Need 5 calls before threshold check


memory:
  episodic:
    redis:
      host: ${MEMORY_EPISODIC_REDIS_HOST:localhost}
      port: ${MEMORY_EPISODIC_REDIS_PORT:6379}
      ttl: 3600  # 1 hour
  semantic:
    qdrant:
      host: ${MEMORY_SEMANTIC_QDRANT_HOST:localhost}
      port: ${MEMORY_SEMANTIC_QDRANT_PORT:6334}
      api-key: ${MEMORY_SEMANTIC_QDRANT_API_KEY:}
  knowledge:
    sqlite:
      path: /var/lib/synapse/knowledge.db

logging:
  level:
    com.synapse.memory: DEBUG
    reactor.netty.transport.TransportConnector: ERROR