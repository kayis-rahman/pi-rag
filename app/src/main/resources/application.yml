    redis:
      host: localhost
      port: 6379
      ttl: 3600  # 1 hour
  semantic:
    qdrant:
      host: localhost
      port: 6334
      api-key: ""
  knowledge:
    sqlite:
      path: /var/lib/synapse/knowledge.db

logging:
  level:
    com.synapse.memory: DEBUG
    reactor.netty.transport.TransportConnector: ERROR