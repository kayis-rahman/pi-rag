server:
  port: 8080
  # Reactor Netty configuration to suppress TCP_NODELAY warning on macOS
  netty:
    pool:
      max-idle-time: 30000

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:your-api-key-here}

llm:
  model_list:
    - model_name: claude-sonnet-4-6
      api_key: ${GPUHUB_API_KEY:"test-key"}
      instances:
        - instance_id: vllm-primary
          api_base: https://u425-twwp-6d5643db.singapore-b.gpuhub.com:8443/v1
          enabled: true
          is_primary: true
        - instance_id: vllm-backup
          api_base: https://u425-u70w-e4420dcd.singapore-b.gpuhub.com:8443/v1
          enabled: true
          is_primary: false
    - model_name: claude-sonnet-4-5-20251022
      api_key: ${GPUHUB_API_KEY:"test-key"}
      instances:
        - instance_id: vllm-primary
          api_base: https://u425-twwp-6d5643db.singapore-b.gpuhub.com:8443/v1
          enabled: true
          is_primary: true
        - instance_id: vllm-backup
          api_base: https://u425-u70w-e4420dcd.singapore-b.gpuhub.com:8443/v1
          enabled: true
          is_primary: false
    - model_name: claude-sonnet-4-5
      api_key: ${GPUHUB_API_KEY:"test-key"}
      instances:
        - instance_id: vllm-primary
          api_base: https://u425-twwp-6d5643db.singapore-b.gpuhub.com:8443/v1
          enabled: true
          is_primary: true
        - instance_id: vllm-backup
          api_base: https://u425-u70w-e4420dcd.singapore-b.gpuhub.com:8443/v1
          enabled: true
          is_primary: false
    - model_name: claude-haiku-4-5-20251001
      api_key: ${GPUHUB_API_KEY:"test-key"}
      instances:
        - instance_id: vllm-primary
          api_base: https://u425-twwp-6d5643db.singapore-b.gpuhub.com:8443/v1
          enabled: true
          is_primary: true
        - instance_id: vllm-backup
          api_base: https://u425-u70w-e4420dcd.singapore-b.gpuhub.com:8443/v1
          enabled: true
          is_primary: false
    - model_name: claude-haiku-4-5
      api_key: ${GPUHUB_API_KEY:"test-key"}
      instances:
        - instance_id: vllm-primary
          api_base: https://u425-twwp-6d5643db.singapore-b.gpuhub.com:8443/v1
          enabled: true
          is_primary: true
        - instance_id: vllm-backup
          api_base: https://u425-u70w-e4420dcd.singapore-b.gpuhub.com:8443/v1
          enabled: true
          is_primary: false
  litellm_settings:
    drop_params: true
    set_verbose: false
  general_settings:
    disable_cooldowns: true
  settings:
    default-model: claude-sonnet-4-6
  routing:
    enabled: true
    servers:
      small:
        instance-id: g139-9b
        api-base: https://u425-twwp-6d5643db.singapore-b.gpuhub.com:8443/v1
        api-key: ${GPUHUB_API_KEY:"test-key"}
        served-model-name: Qwen3.5-9B
      large:
        instance-id: g145-35b
        api-base: https://u425-u70w-e4420dcd.singapore-b.gpuhub.com:8443/v1
        api-key: ${GPUHUB_API_KEY:"test-key"}
        served-model-name: Qwen3.5-35B
    model-tier-map:
      claude-sonnet-4-6: LARGE
      claude-sonnet-4-5-20251022: LARGE
      claude-sonnet-4-5: LARGE
      claude-haiku-4-5-20251001: SMALL
      claude-haiku-4-5: SMALL
    rules:
      max-small-tokens: 500
      max-small-words: 30
