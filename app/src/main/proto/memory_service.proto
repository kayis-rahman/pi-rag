syntax = "proto3";

option java_package = "com.synapse.grpc";
option java_outer_classname = "MemoryServiceProto";

package memory;

// Memory Service definition
service MemoryService {
  rpc StoreEpisode (StoreEpisodeRequest) returns (StoreEpisodeResponse);
  rpc SearchSimilarCode (CodeSearchRequest) returns (CodeSearchResponse);
  rpc GetSessionSummary (SessionRequest) returns (SessionSummary);
}

// Request messages
message StoreEpisodeRequest {
  string session_id = 1;
  string content = 2;
}

message CodeSearchRequest {
  string query = 1;
  int32 limit = 2;
}

message SessionRequest {
  string session_id = 1;
}

// Response messages
message StoreEpisodeResponse {
  bool success = 1;
  string message = 2;
}

message CodeSearchResponse {
  repeated CodeMatch matches = 1;
}

message CodeMatch {
  string file_path = 1;
  string content_preview = 2;
  float similarity_score = 3;
}

message SessionSummary {
  string session_id = 1;
  int32 episode_count = 2;
  string summary_text = 3;
}