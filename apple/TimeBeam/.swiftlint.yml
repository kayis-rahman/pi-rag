# SwiftLint Configuration for TimeBeam
# Based on Clean Code Rules

# Enabled rules
disabled_rules:
  - trailing_whitespace
  - vertical_whitespace
  - line_length
  - file_length
  - type_body_length
  - function_body_length

# Custom rules for clean code
opt_in_rules:
  - force_unwrapping
  - implicit_getter
  - empty_string
  - unused_optional_binding
  - redundant_nil_coalescing
  - force_try
  - force_cast

# Rule configurations
force_unwrapping:
  severity: error

force_try:
  severity: error

force_cast:
  severity: error

# Exclusions
excluded:
  - Carthage
  - Pods
  - build/
  - .build/
  - TimeBeam.xcodeproj/

# Custom rules for security and clean code
custom_rules:
  sensitive_logging:
    name: "Sensitive Data Logging"
    regex: "(log|print|os_log).*(\\%\\{.*\\}|email|token|password|secret)"
    message: "Avoid logging sensitive data. Use private logging for sensitive information."
    severity: error

  force_unwrap:
    name: "Force Unwrap Usage"
    regex: "\\w+!"
    message: "Avoid force unwrapping. Use optional binding or guard statements."
    severity: warning

  singleton_pattern:
    name: "Singleton Pattern"
    regex: "static let shared\\s*=\\s*\\w+\\(\\)\\n*class func"
    message: "Avoid singleton pattern unless absolutely necessary. Consider dependency injection."
    severity: warning

# File length limits (reasonable for clean code)
file_length:
  warning: 400
  error: 600

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

# Line length (reasonable limit)
line_length:
  warning: 120
  error: 150
