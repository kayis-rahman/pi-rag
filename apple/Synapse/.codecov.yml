# Codecov Configuration for Synapse
# https://docs.codecov.com/docs/codecov-yaml

codecov:
  require_ci_to_pass: true
  notify:
    after_n_builds: 3

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%
        base: auto
        informational: false
    patch:
      default:
        target: auto
        threshold: 1%
        base: auto

ignore:
  # Backend test exclusions
  - "**/test/**"
  - "**/Test*.java"
  - "**/*Test.java"
  - "**/target/**"
  - "**/generated/**"
  - "**/generated-sources/**"
  - "**/model/**"
  - "**/dto/**"
  - "**/config/**"

  # iOS test exclusions
  - "**/*Tests.swift"
  - "**/Tests/**"
  - "**/Test/**"
  - "**/DerivedData/**"
  - "**/build/**"
  - "**/*.generated.swift"

comment:
  layout: "reach,diff,flags,tree,reach,delta"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  after_n_builds: 3
  branches:
    - "main"
    - "develop"

flags:
  backend:
    paths:
      - back-end/src/main/java
  backend-tests:
    paths:
      - back-end/src/test/java
  ios:
    paths:
      - apple/Synapse/Synapse
  ios-tests:
    paths:
      - apple/Synapse/SynapseTests
  macos:
    paths:
      - apple/Synapse/Synapse
  macos-tests:
    paths:
      - apple/Synapse/SynapseTests
  watchos:
    paths:
      - apple/Synapse/SynapseWatch Watch App
  watchos-tests:
    paths:
      - apple/Synapse/SynapseUITests

github_checks:
  annotations: true

fixes:
  - "back-end/src/main/java/::back-end/src/test/java/"
  - "apple/Synapse/Synapse/::apple/Synapse/SynapseTests/"

parsers:
  v1:
    include_branch:
      - main
      - develop
    merge_base:
      - main
      - develop

slug:
  separation:
    backend:
      regex: "^back-end/"
      flag: backend
    ios:
      regex: "^apple/Synapse/"
      flag: ios
