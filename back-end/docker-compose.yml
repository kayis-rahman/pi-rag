version: '3.8'

services:
  db:
    image: postgres:15
    container_name: timebeam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: timebeam
      POSTGRES_USER: timebeam
      POSTGRES_PASSWORD: timebeam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: timebeam_postgres_data

