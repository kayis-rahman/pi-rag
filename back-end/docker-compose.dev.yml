version: '3.8'

services:
  db:
    image: postgres:15
    container_name: timebeam_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: timebeam_e2e
      POSTGRES_USER: timebeam
      POSTGRES_PASSWORD: timebeam
    ports:
      - "5432:5432"   # map container Postgres to host so IntelliJ (and the app running on host) can connect to localhost:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devnet

networks:
  devnet:
    driver: bridge

volumes:
  postgres_data:
    name: timebeam_postgres_data

