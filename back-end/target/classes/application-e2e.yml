# E2E Test Configuration
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/timebeam_e2e
    username: timebeam
    password: timebeam
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    enabled: true

# JWT configuration for E2E tests
jwt:
  secret: e2e-test-jwt-secret-key-for-testing-purposes-only-not-for-production
  expiration-ms: 86400000  # 24 hours for testing

# Logging for E2E tests
logging:
  level:
    com.sparkage.timebeam: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# APNs disabled for E2E tests
apns:
  enabled: false