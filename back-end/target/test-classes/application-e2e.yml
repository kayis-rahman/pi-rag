server:
  port: 8081
  address: 0.0.0.0

spring:
  profiles:
    active: e2e
  datasource:
    url: jdbc:postgresql://localhost:5432/timebeam_e2e
    username: timebeam
    password: timebeam
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  main:
    allow-bean-definition-overriding: true

jwt:
  secret: e2e-test-jwt-secret-key-for-testing-purposes-only-not-for-production
  expiration-ms: 3600000 # 1 hour for tests

logging:
  level:
    root: INFO
    com.sparkage.timebeam: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

# Test-specific configuration
app:
  debug: true
  e2e:
    enabled: true
    seed-data: true

# APNS disabled for e2e tests
apns:
  enabled: false
