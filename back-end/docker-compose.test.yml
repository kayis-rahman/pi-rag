version: '3.8'

services:
  db:
    image: postgres:15
    container_name: timebeam_postgres_test
    environment:
      POSTGRES_DB: timebeam_test
      POSTGRES_USER: timebeam_test
      POSTGRES_PASSWORD: test_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
