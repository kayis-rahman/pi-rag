# Test configuration for integration tests
spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://localhost:5432/synapse
    username: synapse
    password: synapse
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop  # Create and drop schema for tests
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: synapsetest

  security:
    enabled: true

# JWT configuration for tests
jwt:
  secret: test-jwt-secret-key-for-testing-purposes-only-not-for-production-use
  expiration-ms: 86400000  # 24 hours for testing

# Logging for tests
logging:
  level:
    com.sparkage.synapse: DEBUG
    org.springframework.security: DEBUG
    org.springframework.test: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
