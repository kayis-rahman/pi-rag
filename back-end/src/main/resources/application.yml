server:
  port: 8080
  address: 0.0.0.0

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${SPRING_DATASOURCE_HOST}:${SPRING_DATASOURCE_PORT}/timebeam_e2e}
    username: ${SPRING_DATASOURCE_USERNAME:timebeam}
    password: ${SPRING_DATASOURCE_PASSWORD:timebeam}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  main:
    allow-bean-definition-overriding: false

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret}
  expiration-ms: 900000 # 15 minutes

logging:
  level:
    root: INFO
    com.sparkage.timebeam: DEBUG
    org.springframework: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
  file:
    name: logs/timebeam.log
    max-size: 10MB
    max-history: 1
    total-size-cap: 100MB
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 1
      total-size-cap: 100MB
      file-name-pattern: logs/timebeam.%d{yyyy-MM-dd}.%i.log

# Optional flag to enable verbose debug via environment
app:
  debug: ${APP_DEBUG:false}

# Apple Push Notification Service Configuration
apns:
   enabled: ${APNS_ENABLED:true}
   key-path: ${APNS_KEY_PATH:/Users/kayisrahman/Documents/workspace/ideas/time-beam-firebase/AuthKey_3UJ4UY4Q6Y.p8}
   key-id: ${APNS_KEY_ID:3UJ4UY4Q6Y}
   team-id: ${APNS_TEAM_ID:425MSY8FLG}
   bundle-id-ios: ${APNS_BUNDLE_ID_IOS:com.sparkage.time-beam.ios}
   bundle-id-macos: ${APNS_BUNDLE_ID_MACOS:com.sparkage.time-beam}
   production: ${APNS_PRODUCTION:false}
